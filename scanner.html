<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payroll QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #183c2b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .scanner-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      color: #183c2b;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    #qr-reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f6f3;
      color: #183c2b;
      font-size: 14px;
      min-height: 45px;
    }
  </style>
</head>

<body>

  <div class="scanner-card">

    <div class="title">
      PAYROLL QR SCANNER
    </div>

    <div class="subtitle">
      Scan Employee QR Code
    </div>

    <div id="qr-reader"></div>

    <div id="result">
      Starting camera...
    </div>

  </div>

  <script>

    function startQRScanner() {
  const scanner = new Html5Qrcode("qr-reader");

  scanner.start(
    { facingMode: "user" },
    {
      fps: 10,
      qrbox: { width: 220, height: 220 }
    },

    function(decodedText) {

      document.getElementById('qr-result').innerText =
        'QR detected. Checking employee...';

      scanner.stop().then(function() {

        const callbackName =
          'qrCallback_' + Date.now();

        window[callbackName] = function(result) {

          if (result.success) {

            document.getElementById('qr-result').innerText =
              'Employee found: ' +
              result.employee.employeeId +
              ' - ' +
              result.employee.fullName;

          } else {

            document.getElementById('qr-result').innerText =
              'QR Error: ' + result.message;

          }

          delete window[callbackName];
        };

        const script = document.createElement('script');

        const webAppUrl =
          'https://script.google.com/macros/s/AKfycbwfBd3I_jQpcbbMwnq0WweNTlF0Svgi0yRVf7LDbw0snOToMNzYvrIbXs9AF7_PSy_mbw/exec';

        script.src =
          webAppUrl +
          '?action=lookupEmployeeByQR' +
          '&qr=' + encodeURIComponent(decodedText) +
          '&callback=' + callbackName;

        script.onerror = function() {
          document.getElementById('qr-result').innerText =
            'Unable to connect to the attendance system.';

          delete window[callbackName];
        };

        document.body.appendChild(script);

      }).catch(function(error) {

        document.getElementById('qr-result').innerText =
          'Scanner error: ' + error;

      });
    },

    function(errorMessage) {
      // Ignore normal scanning errors
    }

  ).catch(function(error) {

    document.getElementById('qr-result').innerText =
      'Unable to open camera: ' + error;

  });
}

      const result =
        document.getElementById('result');

      const scanner =
        new Html5Qrcode('qr-reader');

      scanner.start(
  { facingMode: "user" },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        function(decodedText) {

          result.innerHTML =
            '<strong>QR DETECTED</strong><br>' +
            decodedText;

          scanner.stop();

        },

        function(errorMessage) {
          // Normal scanning feedback.
        }

      ).catch(function(error) {

        result.innerText =
          'Camera error: ' + error;

      });

    }

    startScanner();

  </script>

</body>
</html>
