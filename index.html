<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payroll QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #183c2b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .scanner-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      color: #183c2b;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    #qr-reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f6f3;
      color: #183c2b;
      font-size: 14px;
      min-height: 45px;
    }
  </style>
</head>

<body>

  <div class="scanner-card">

    <div class="title">
      PAYROLL QR SCANNER
    </div>

    <div class="subtitle">
      Scan Employee QR Code
    </div>

    <div id="qr-reader"></div>

    <div id="result">
      Starting camera...
    </div>

  </div>

  <script>

function startScanner() {

  const result = document.getElementById('result');
  const scanner = new Html5Qrcode('qr-reader');

  result.innerText = 'Starting camera...';

  scanner.start(
    { facingMode: { ideal: "user" } },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      result.innerText =
        'QR detected. Getting GPS location...';

      scanner.stop().then(function() {

        if (!navigator.geolocation) {
          result.innerText =
            'GPS is not supported on this device.';
          return;
        }

        navigator.geolocation.getCurrentPosition(

          function(position) {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;

            result.innerText =
              'GPS detected. Recording attendance...';

            const callbackName =
  'attendanceCallback_' + Date.now();

let responseReceived = false;

const webAppUrl =
  'https://script.google.com/macros/s/AKfycbwfBd3I_jQpcbbMwnq0WweNTlF0Svgi0yRVf7LDbw0snOToMNzYvrIbXs9AF7_PSy_mbw/exec';

const script =
  document.createElement('script');

const deviceId =
  'ANDROID-' +
  navigator.userAgent.substring(0, 50);

window[callbackName] = function(data) {

  responseReceived = true;

  if (data.success) {

    result.innerHTML =
      '<strong>ATTENDANCE RECORDED</strong><br><br>' +
      data.employee.employeeId +
      '<br>' +
      data.employee.fullName;

  } else {

    result.innerText =
      'Attendance Error: ' +
      data.message;

  }

  delete window[callbackName];
};

script.src =
  webAppUrl +
  '?action=recordAttendanceByQR' +
  '&qr=' +
  encodeURIComponent(decodedText) +
  '&latitude=' +
  encodeURIComponent(latitude) +
  '&longitude=' +
  encodeURIComponent(longitude) +
  '&deviceId=' +
  encodeURIComponent(deviceId) +
  '&callback=' +
  callbackName;

document.body.appendChild(script);

setTimeout(function() {

  if (!responseReceived) {

    result.innerText =
      'No response from attendance system.';

    delete window[callbackName];
  }

}, 10000);

          },

          function(error) {

            result.innerText =
              'Unable to get GPS location. Please allow location access.';

          },

          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }

        );

      }).catch(function(error) {

        result.innerText =
          'Scanner error: ' + error;

      });
    },

    function(errorMessage) {
      // Normal QR scanning feedback.
    }

  ).then(function() {

    result.innerText =
      'Camera ready. Scan employee QR code.';

  }).catch(function(error) {

    result.innerText =
      'Camera error: ' + error;

  });

}

window.addEventListener('load', startScanner);

</script>
  </script>

</body>
</html>
