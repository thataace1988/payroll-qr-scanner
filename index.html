<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payroll QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    #gps-status {
  margin-top: 12px;
  padding: 10px;
  border-radius: 10px;
  background: #f3f6f3;
  color: #183c2b;
  font-size: 13px;
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #183c2b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .scanner-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      color: #183c2b;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    #qr-reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f6f3;
      color: #183c2b;
      font-size: 14px;
      min-height: 45px;
    }
  </style>
</head>

<body>

  <div class="scanner-card">

    <div class="title">
      PAYROLL QR SCANNER
    </div>

    <div class="subtitle">
      Scan Employee QR Code
    </div>

    <div id="qr-reader"></div>
    <div id="gps-status">
  📍 Checking GPS location...
</div>

    <div id="result">
      Starting camera...
    </div>

  </div>

  <script>

let currentLatitude = null;
let currentLongitude = null;


// --------------------------------------------------
// CHECK GPS FIRST
// --------------------------------------------------

function checkGPS() {

  const gpsStatus =
    document.getElementById('gps-status');

  gpsStatus.innerText =
    '📍 Getting your GPS location...';

  if (!navigator.geolocation) {

    gpsStatus.innerText =
      '❌ GPS is not supported on this device.';

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      currentLatitude =
        position.coords.latitude;

      currentLongitude =
        position.coords.longitude;

      gpsStatus.innerText =
        '📍 GPS detected. Checking branch...';

      const callbackName =
        'branchCallback_' + Date.now();

      const webAppUrl =
        'https://script.google.com/macros/s/AKfycbwfBd3I_jQpcbbMwnq0WweNTlF0Svgi0yRVf7LDbw0snOToMNzYvrIbXs9AF7_PSy_mbw/exec';

      const script =
        document.createElement('script');

      window[callbackName] =
        function(data) {

          if (data && data.success) {

            if (data.insideGeofence) {

              gpsStatus.innerHTML =
                '✅ <strong>' +
                data.branchName +
                '</strong><br>' +
                'Within authorized area • ' +
                data.distanceMeters +
                ' meters away';

            } else {

              gpsStatus.innerHTML =
                '⚠️ <strong>Outside authorized area</strong><br>' +
                'Nearest: ' +
                data.branchName +
                ' • ' +
                data.distanceMeters +
                ' meters away';

            }

          } else {

            gpsStatus.innerText =
              '⚠️ Unable to identify branch.';

          }

          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          // Start camera after GPS/branch check
          startScanner();

        };

      script.src =
        webAppUrl +
        '?action=detectBranchByGPS' +
        '&latitude=' +
        encodeURIComponent(currentLatitude) +
        '&longitude=' +
        encodeURIComponent(currentLongitude) +
        '&callback=' +
        callbackName;

      document.body.appendChild(script);

    },

    function(error) {

      gpsStatus.innerText =
        '⚠️ GPS permission is required.';

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}

  const gpsStatus =
    document.getElementById('gps-status');

  gpsStatus.innerText =
    '📍 Getting your GPS location...';

  if (!navigator.geolocation) {

    gpsStatus.innerText =
      '❌ GPS is not supported on this device.';

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      currentLatitude =
        position.coords.latitude;

      currentLongitude =
        position.coords.longitude;

      gpsStatus.innerHTML =
        '✅ GPS location ready<br>' +
        '<small>' +
        currentLatitude.toFixed(6) +
        ', ' +
        currentLongitude.toFixed(6) +
        '</small>';

      startScanner();

    },

    function(error) {

      gpsStatus.innerText =
        '⚠️ GPS permission is required. Please allow location access.';

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}


// --------------------------------------------------
// START QR SCANNER
// --------------------------------------------------

function startScanner() {

  const result =
    document.getElementById('result');

  const scanner =
    new Html5Qrcode('qr-reader');

  result.innerText =
    'Starting camera...';

  scanner.start(

    { facingMode: "user" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      result.innerText =
        'QR detected. Recording attendance...';

      scanner.stop().then(function() {

        recordQRAttendance(
          decodedText
        );

      }).catch(function(error) {

        result.innerText =
          'Scanner error: ' + error;

      });

    },

    function(errorMessage) {
      // Normal QR scanning feedback.
    }

  ).then(function() {

    result.innerText =
      'Camera ready. Scan employee QR code.';

  }).catch(function(error) {

    result.innerText =
      'Camera error: ' + error;

  });

}


// --------------------------------------------------
// RECORD QR ATTENDANCE
// --------------------------------------------------

function recordQRAttendance(qrToken) {

  const callbackName =
    'attendanceCallback_' + Date.now();

  let responseReceived = false;

  const webAppUrl =
    'https://script.google.com/macros/s/AKfycbwfBd3I_jQpcbbMwnq0WweNTlF0Svgi0yRVf7LDbw0snOToMNzYvrIbXs9AF7_PSy_mbw/exec';

  const script =
    document.createElement('script');

  const deviceId =
    'ANDROID-' +
    navigator.userAgent.substring(0, 50);

  window[callbackName] =
    function(data) {

      responseReceived = true;

      if (data.success) {

        const attendance =
          data.attendance || {};

        document.getElementById('result').innerHTML =
          '<strong>✅ ATTENDANCE RECORDED</strong><br><br>' +
          '<strong>Employee:</strong><br>' +
          data.employee.employeeId +
          '<br>' +
          data.employee.fullName +
          '<br><br>' +
          '<strong>Event:</strong> ' +
          (attendance.eventType || 'Attendance') +
          '<br>' +
          '<strong>Branch:</strong> ' +
          (attendance.branchName || '') +
          '<br>' +
          '<strong>Method:</strong> QR';

      } else {

        document.getElementById('result').innerText =
          'Attendance Error: ' +
          (data.message || 'Unknown error.');

      }

      delete window[callbackName];

    };

  script.src =
    webAppUrl +
    '?action=recordAttendanceByQR' +
    '&qr=' +
    encodeURIComponent(qrToken) +
    '&latitude=' +
    encodeURIComponent(currentLatitude) +
    '&longitude=' +
    encodeURIComponent(currentLongitude) +
    '&deviceId=' +
    encodeURIComponent(deviceId) +
    '&callback=' +
    callbackName;

  document.body.appendChild(script);

  setTimeout(function() {

    if (!responseReceived) {

      document.getElementById('result').innerText =
        'No response from attendance system.';

      delete window[callbackName];

    }

  }, 10000);

}


// --------------------------------------------------
// START GPS WHEN PAGE LOADS
// --------------------------------------------------

window.addEventListener(
  'load',
  checkGPS
);

</script>
