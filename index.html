<script>

let currentLatitude = null;
let currentLongitude = null;
let currentBranch = null;


// --------------------------------------------------
// CHECK GPS FIRST
// --------------------------------------------------

function checkGPS() {

  const gpsStatus =
    document.getElementById('gps-status');

  gpsStatus.innerText =
    '📍 Getting your GPS location...';

  if (!navigator.geolocation) {

    gpsStatus.innerText =
      '❌ GPS is not supported on this device.';

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      currentLatitude =
        position.coords.latitude;

      currentLongitude =
        position.coords.longitude;

      gpsStatus.innerText =
        '📍 GPS detected. Checking branch...';

      const callbackName =
        'branchCallback_' + Date.now();

      const webAppUrl =
        'https://script.google.com/macros/s/AKfycbwfBd3I_jQpcbbMwnq0WweNTlF0Svgi0yRVf7LDbw0snOToMNzYvrIbXs9AF7_PSy_mbw/exec';

      const script =
        document.createElement('script');

      window[callbackName] =
        function(data) {

          if (data && data.success) {

            currentBranch =
              data;

            if (data.insideGeofence) {

              gpsStatus.innerHTML =
                '✅ <strong>' +
                data.branchName +
                '</strong><br>' +
                'Within authorized area • ' +
                data.distanceMeters +
                ' meters away';

            } else {

              gpsStatus.innerHTML =
                '⚠️ <strong>Outside authorized area</strong><br>' +
                'Nearest: ' +
                data.branchName +
                ' • ' +
                data.distanceMeters +
                ' meters away';

            }

          } else {

            gpsStatus.innerText =
              '⚠️ Unable to identify branch.';

          }

          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          // Camera starts only after GPS/branch check
          startScanner();

        };

      script.src =
        webAppUrl +
        '?action=detectBranchByGPS' +
        '&latitude=' +
        encodeURIComponent(currentLatitude) +
        '&longitude=' +
        encodeURIComponent(currentLongitude) +
        '&callback=' +
        callbackName;

      document.body.appendChild(script);

    },

    function(error) {

      gpsStatus.innerText =
        '⚠️ GPS permission is required.';

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


// --------------------------------------------------
// START QR SCANNER
// --------------------------------------------------

function startScanner() {

  const result =
    document.getElementById('result');

  const scanner =
    new Html5Qrcode('qr-reader');

  result.innerText =
    'Starting camera...';

  scanner.start(

    { facingMode: "user" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      result.innerText =
        'QR detected. Recording attendance...';

      scanner.stop().then(function() {

        recordQRAttendance(
          decodedText
        );

      }).catch(function(error) {

        result.innerText =
          'Scanner error: ' + error;

      });

    },

    function(errorMessage) {
      // Normal QR scanning feedback.
    }

  ).then(function() {

    result.innerText =
      'Camera ready. Scan employee QR code.';

  }).catch(function(error) {

    result.innerText =
      'Camera error: ' + error;

  });

}


// --------------------------------------------------
// RECORD QR ATTENDANCE
// --------------------------------------------------

function recordQRAttendance(qrToken) {

  const callbackName =
    'attendanceCallback_' + Date.now();

  let responseReceived = false;

  const webAppUrl =
    'https://script.google.com/macros/s/AKfycbwfBd3I_jQpcbbMwnq0WweNTlF0Svgi0yRVf7LDbw0snOToMNzYvrIbXs9AF7_PSy_mbw/exec';

  const script =
    document.createElement('script');

  const deviceId =
    'ANDROID-' +
    navigator.userAgent.substring(0, 50);

  window[callbackName] =
    function(data) {

      responseReceived = true;

      if (data && data.success) {

        const attendance =
          data.attendance || {};

        document.getElementById('result').innerHTML =
          '<strong>✅ ATTENDANCE RECORDED</strong><br><br>' +
          '<strong>Employee:</strong><br>' +
          data.employee.employeeId +
          '<br>' +
          data.employee.fullName +
          '<br><br>' +
          '<strong>Event:</strong> ' +
          (attendance.eventType || 'Attendance') +
          '<br>' +
          '<strong>Branch:</strong> ' +
          (attendance.branchName || '') +
          '<br>' +
          '<strong>Method:</strong> QR';

      } else {

        document.getElementById('result').innerText =
          'Attendance Error: ' +
          (data && data.message
            ? data.message
            : 'Unknown error.');

      }

      delete window[callbackName];

    };

  script.src =
    webAppUrl +
    '?action=recordAttendanceByQR' +
    '&qr=' +
    encodeURIComponent(qrToken) +
    '&latitude=' +
    encodeURIComponent(currentLatitude) +
    '&longitude=' +
    encodeURIComponent(currentLongitude) +
    '&deviceId=' +
    encodeURIComponent(deviceId) +
    '&callback=' +
    callbackName;

  document.body.appendChild(script);

  setTimeout(function() {

    if (!responseReceived) {

      document.getElementById('result').innerText =
        'No response from attendance system.';

      delete window[callbackName];

    }

  }, 10000);

}


// --------------------------------------------------
// START GPS WHEN PAGE LOADS
// --------------------------------------------------

window.addEventListener(
  'load',
  checkGPS
);

</script>
